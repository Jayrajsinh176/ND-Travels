<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/images/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>ND Tours and Travels</title>
    <style>
      #page-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: linear-gradient(180deg, #ffffff 0%, #fff3e8 100%);
        font-family: "Poppins", system-ui, sans-serif;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #page-loader.loader-hidden {
        opacity: 0;
        visibility: hidden;
      }
      /* Logo drops in and bounces like a map pin */
      .loader-pin {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .loader-logo {
        width: 130px;
        height: 130px;
        object-fit: contain;
        animation: loader-hop 1.4s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      .loader-shadow {
        width: 80px;
        height: 10px;
        margin-top: 6px;
        border-radius: 50%;
        background: rgba(13, 45, 85, 0.18);
        animation: loader-shadow 1.4s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      /* Road with a taxi driving across */
      .loader-road {
        position: relative;
        width: 220px;
        height: 34px;
        overflow: hidden;
      }
      .loader-road::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 10px;
        border-radius: 5px;
        background: #0d2d55;
      }
      .loader-road::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 4px;
        width: 200%;
        height: 2px;
        background: repeating-linear-gradient(90deg, #ffffff 0 14px, transparent 14px 26px);
        animation: loader-lanes 0.6s linear infinite;
      }
      .loader-car {
        position: absolute;
        bottom: 8px;
        left: 0;
        width: 46px;
        height: 24px;
        animation: loader-drive 2.4s ease-in-out infinite;
      }
      .loader-car svg {
        display: block;
        animation: loader-bump 0.3s ease-in-out infinite alternate;
      }
      .loader-text {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: #0d2d55;
      }
      .loader-text span {
        color: #ff6900;
      }
      @keyframes loader-hop {
        0%, 100% { transform: translateY(0) scale(1.05, 0.95); }
        50% { transform: translateY(-28px) scale(0.97, 1.03); }
      }
      @keyframes loader-shadow {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.6); opacity: 0.5; }
      }
      @keyframes loader-lanes {
        to { transform: translateX(-26px); }
      }
      @keyframes loader-drive {
        0% { transform: translateX(-50px); }
        100% { transform: translateX(230px); }
      }
      @keyframes loader-bump {
        to { transform: translateY(-1.5px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .loader-logo, .loader-shadow, .loader-car, .loader-car svg, .loader-road::after {
          animation-duration: 4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="page-loader" role="status" aria-label="Loading">
      <div class="loader-pin">
        <img class="loader-logo" src="/images/favicon.webp" alt="" />
        <div class="loader-shadow"></div>
      </div>
      <div class="loader-road">
        <div class="loader-car">
          <svg viewBox="0 0 46 24" width="46" height="24" aria-hidden="true">
            <path d="M4 16 L6 10 Q7 8 10 8 L15 8 L19 3 Q20 2 22 2 L32 2 Q34 2 35 3 L39 8 Q43 8 44 11 L44 16 Z" fill="#ff6900" />
            <path d="M20 4 L23 4 L23 8 L17 8 Z M25 4 L31 4 Q32 4 33 5 L36 8 L25 8 Z" fill="#dbeafe" />
            <rect x="26" y="0" width="6" height="2" rx="1" fill="#0d2d55" />
            <circle cx="12" cy="17" r="4.5" fill="#0d2d55" />
            <circle cx="12" cy="17" r="1.8" fill="#ffffff" />
            <circle cx="36" cy="17" r="4.5" fill="#0d2d55" />
            <circle cx="36" cy="17" r="1.8" fill="#ffffff" />
            <rect x="42" y="11" width="2" height="2" fill="#fff3a0" />
          </svg>
        </div>
      </div>
      <p class="loader-text">ND TOURS <span>&amp;</span> TRAVELS</p>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var start = Date.now();
        var MIN_VISIBLE = 800; // keep it on screen long enough to not flash
        function hide() {
          var loader = document.getElementById("page-loader");
          if (!loader) return;
          setTimeout(function () {
            loader.classList.add("loader-hidden");
            setTimeout(function () { loader.remove(); }, 600);
          }, Math.max(0, MIN_VISIBLE - (Date.now() - start)));
        }
        if (document.readyState === "complete") hide();
        else window.addEventListener("load", hide);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
